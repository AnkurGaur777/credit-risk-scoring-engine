[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "0.1.0"
description = "Credit risk scoring with explainability: WoE scorecard, LightGBM challenger, calibration, SHAP, profit cut-off, fairness, PSI, FastAPI"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scikit-learn>=1.4", "lightgbm>=4.3",
  "joblib>=1.3", "fastapi>=0.110", "pydantic>=2.6", "uvicorn>=0.27",
]

[project.optional-dependencies]
full = [
  "xgboost>=2.0", "shap>=0.45", "optuna>=3.5", "mlflow>=2.12", "matplotlib>=3.8",
  "seaborn>=0.13", "reportlab>=4.0", "nbformat>=5.9", "nbclient>=0.9", "ipykernel>=6.29",
]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::UserWarning", "ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
